<header class="border-b border-stone-200 bg-white">
  <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3" aria-label="Principal">
    <a routerLink="/" class="text-lg font-semibold text-amber-700">🍳 Recetario por ingredientes</a>
    <div class="flex items-center gap-4 text-sm font-medium">
      <a
        routerLink="/"
        routerLinkActive="text-amber-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:text-amber-700"
      >
        Buscar
      </a>
      <a routerLink="/favoritos" routerLinkActive="text-amber-700" class="flex items-center gap-1 hover:text-amber-700">
        Favoritos
        @if (favorites.count() > 0) {
          <span class="rounded-full bg-amber-100 px-2 text-xs text-amber-800">{{ favorites.count() }}</span>
        }
      </a>
    </div>
  </nav>
</header>

<main class="mx-auto max-w-5xl px-4 py-6">
  <router-outlet />
</main>

<footer class="mx-auto max-w-5xl px-4 pb-8 text-xs text-stone-500">
  Recetas de <a href="https://www.themealdb.com" target="_blank" rel="noopener noreferrer" class="underline">TheMealDB</a>.
  Las calorías son una estimación aproximada con una tabla base de ingredientes; no sustituyen información nutricional real.
</footer>
